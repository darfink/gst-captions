name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt-clippy:
    name: fmt + clippy
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --no-default-features --features flvmux,rollup -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, macos-14]
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install cmake gstreamer
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      - run: cargo test --workspace --locked
      - name: Verify plugins register
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 captionsflvmux
          gst-inspect-1.0 captionsrollup
          gst-inspect-1.0 captionstranscriber

  test-no-transcribe:
    name: test without the transcriber (CPU-free build)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - name: Install GStreamer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad gstreamer1.0-plugins-ugly \
            gstreamer1.0-tools
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: no-transcribe
      - run: cargo build --workspace --locked --no-default-features --features flvmux,rollup
      - run: cargo test --workspace --locked --no-default-features --features flvmux,rollup
      - name: Verify plugins register
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 captionsflvmux
          gst-inspect-1.0 captionsrollup

  test-metal:
    name: test with the Metal backend
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: Install dependencies
        run: brew install cmake gstreamer
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: metal
      - run: cargo build --workspace --locked --features metal
      - run: cargo test --workspace --locked --features metal
      - name: Verify plugins register
        env:
          GST_PLUGIN_PATH: ${{ github.workspace }}/target/debug
        run: |
          gst-inspect-1.0 captionsflvmux
          gst-inspect-1.0 captionsrollup
          gst-inspect-1.0 captionstranscriber

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t gst-captions .
